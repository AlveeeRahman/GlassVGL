CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_GLASSVGL=y
CONFIG_MAIN_STACK_SIZE=8192

# The glass buffers come from the C library heap. LVGL's own small pool is too small for them.
CONFIG_LV_Z_MEM_POOL_HEAP_LIB_C=y
# On a real board also give the C library a heap big enough for the mode you want, e.g.
# CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4194304 (native_sim uses the host C library instead).

CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_USE_SNAPSHOT=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_USE_LOG=y
CONFIG_LOG=y

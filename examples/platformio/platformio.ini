; GlassVGL demo for PlatformIO. Pick an environment, then fill in panel_push() in
; src/main.cpp for your display. `pio run -e esp32s3` builds without a display attached.
;
; The GlassVGL pack is pulled in from a GlassVGL-Pro checkout next to this repository
; (symlink://../../../GlassVGL-Pro). In your own project, copy the pack into lib/ instead.

[env]
framework = arduino
lib_deps =
    lvgl/lvgl@^9.3.0
    symlink://../../../GlassVGL-Pro
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; ESP32-S3 with 8 MB PSRAM (N16R8 modules): runs FULL mode up to 1024x600
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DPANEL_W=800 -DPANEL_H=480

; plain ESP32 (WROVER, 4 MB PSRAM): FULL at 320x240 and 480x320
[env:esp32]
platform = espressif32
board = esp-wrover-kit
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DPANEL_W=320 -DPANEL_H=240

; ESP32-C3 / C6 have no PSRAM: AUTO picks LITE
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DPANEL_W=240 -DPANEL_H=240

; RP2040 (Raspberry Pi Pico) with the earlephilhower core: LITE at 320x240
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
board_build.core = earlephilhower
build_flags = ${env.build_flags} -DPANEL_W=320 -DPANEL_H=240

; STM32F429 Discovery (8 MB SDRAM, 240x320 panel)
[env:stm32f429]
platform = ststm32
board = disco_f429zi
build_flags = ${env.build_flags} -DPANEL_W=240 -DPANEL_H=320

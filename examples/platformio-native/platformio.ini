; GlassVGL on PlatformIO's native platform: builds and runs on your PC, no board needed.
;   pio run            build
;   pio run -t exec    run it; it writes glassvgl.ppm, a picture of the home screen
; The GlassVGL pack is pulled in from a GlassVGL-Pro checkout next to this repository
; (symlink://../../../GlassVGL-Pro). In your own project, copy the pack into lib/ instead.

[env:native]
platform = native
lib_deps =
    lvgl/lvgl@^9.3.0
    symlink://../../../GlassVGL-Pro
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -O2
    -lm
